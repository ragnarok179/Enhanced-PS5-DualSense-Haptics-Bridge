name: CI

# Verify every change automatically; publishing a GitHub Release remains manual.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: Source
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Go 1.27.4
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
          cache-dependency-path: Source/go.mod

      - name: Confirm Go version
        run: go version

      - name: Install Lua 5.4 runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends liblua5.4-0

      - name: Generate compatibility index for current build
        run: python3 scripts/generate_compatibility.py --repo-root ..

      - name: Check update safety metadata
        run: python3 scripts/validate_update_safety.py --repo-root ..

      - name: Check BeamNG Mod Manager identity
        run: python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Lua contract tests
        run: python3 tests/run_lua_tests.py

      - name: UI lifecycle tests
        run: node tests/ui_lifecycle.test.cjs

      - name: Go unit tests
        run: go test ./...

      - name: Go race tests
        run: go test -race ./...

      - name: Go vet
        run: go vet ./...

      - name: Build Windows binaries and release ZIPs
        run: python3 scripts/package_release.py --repo-root ..

      - name: Verify release ZIPs and checksums
        run: python3 scripts/verify_release.py --repo-root ..

      - name: Cross-compile Windows tests (USB and Bluetooth)
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          go test -c -tags bluetooth -o dist/tests-bluetooth.exe .
          go test -c -tags usb -o dist/tests-usb.exe .

      - name: Upload verified release candidates
        uses: actions/upload-artifact@v4
        with:
          name: v151-release-candidate
          if-no-files-found: error
          retention-days: 30
          path: |
            Release/Enhanced_PS5_DualSense_Haptics_V1.51.zip
            Release/Enhanced_PS5_DualSense_Haptics_Bridge_V1.51.zip
            Release/Enhanced_PS5_DualSense_Haptics_V1.51_INSTALLATION_BUNDLE.zip
            Release/RELEASE_SHA256SUMS.txt
            Release/BUILD_PROVENANCE.txt
            Release/BRIDGE_COMPATIBILITY.json
