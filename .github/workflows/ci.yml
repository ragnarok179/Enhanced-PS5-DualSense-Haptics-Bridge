name: CI

on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Source
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Unit tests
        run: go test ./...
      - name: Race tests
        run: go test -race ./...
      - name: Linux vet
        run: go vet ./...
      - name: Build Windows binaries
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          go build -trimpath -buildvcs=false -ldflags='-s -w -buildid=' -tags bluetooth -o dist/EnhancedPS5DualSenseHapticsBluetooth.exe .
          go build -trimpath -buildvcs=false -ldflags='-s -w -buildid=' -tags usb -o dist/EnhancedPS5DualSenseHapticsUSB.exe .
          go build -trimpath -buildvcs=false -ldflags='-s -w -buildid=' -o dist/START_BRIDGE.exe ./launcher
          cp dist/START_BRIDGE.exe dist/START_BRIDGE_AND_BEAMNG.exe
          go build -trimpath -buildvcs=false -ldflags='-s -w -buildid=' -o dist/UPDATE_BRIDGE.exe ./updater
      - name: Compile Windows tests
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 0
        run: |
          go test -c -tags bluetooth -o dist/tests-bluetooth.exe .
          go test -c -tags usb -o dist/tests-usb.exe .
      - uses: actions/upload-artifact@v4
        with:
          name: windows-bridge-v1.4
          path: Source/dist/*.exe
