name: CI

on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Tools and diagnostics/Source
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Verify SHA-256 manifest
        working-directory: ${{ github.workspace }}
        run: sha256sum --check SHA256SUMS.txt
      - name: Unit tests
        run: go test ./...
      - name: Windows Bluetooth vet
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 0
        run: go vet -tags bluetooth ./...
      - name: Windows launcher and updater vet
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 0
        run: |
          go vet ./launcher
          go vet ./updater
      - name: Build Windows binaries
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          go build -trimpath -ldflags='-s -w' -tags bluetooth -o dist/EnhancedPS5DualSenseHapticsBluetooth.exe .
          go build -trimpath -ldflags='-s -w' -tags usb -o dist/EnhancedPS5DualSenseHapticsUSB.exe .
          go build -trimpath -buildvcs=false -ldflags='-s -w -buildid=' -o dist/START_BRIDGE.exe ./launcher
          cp dist/START_BRIDGE.exe dist/START_BRIDGE_AND_BEAMNG.exe
          go build -trimpath -buildvcs=false -ldflags='-s -w -buildid=' -o dist/UPDATE_BRIDGE.exe ./updater
      - uses: actions/upload-artifact@v4
        with:
          name: windows-v1
          path: Tools and diagnostics/Source/dist/*.exe
