name: Sync concise V1.43 USB README
on:
  push:
    paths:
      - .github/workflows/sync-v143-short-readme.yml
permissions:
  contents: write
jobs:
  package:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update Bridge ZIP README and checksums
        run: |
          python3 - <<'PY'
          import hashlib, pathlib, zipfile
          root=pathlib.Path('.')
          target=root/'Release/Enhanced_PS5_DualSense_Haptics_Bridge_V1.43.zip'
          with zipfile.ZipFile(target) as archive:
              assert archive.testzip() is None
              files=set(archive.namelist())
              assert 'README.md' in files and 'SHA256SUMS.txt' in files
              assert len(files)==16
              for name in files-{'README.md','SHA256SUMS.txt'}:
                  assert (root/name).is_file() and (root/name).read_bytes()==archive.read(name),name
          managed=sorted(files-{'SHA256SUMS.txt'})
          assert len(managed)==15
          (root/'SHA256SUMS.txt').write_text(''.join(
              hashlib.sha256((root/name).read_bytes()).hexdigest()+'  ./'+name+'\n'
              for name in managed),encoding='utf-8')
          with zipfile.ZipFile(target,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as archive:
              for name in sorted(files):
                  entry=zipfile.ZipInfo(name,date_time=(2026,10,11,12,0,0))
                  entry.compress_type=zipfile.ZIP_DEFLATED
                  entry.external_attr=0o644<<16
                  archive.writestr(entry,(root/name).read_bytes(),compress_type=zipfile.ZIP_DEFLATED,compresslevel=9)
          with zipfile.ZipFile(target) as archive:
              assert archive.testzip() is None
              assert archive.read('README.md')==(root/'README.md').read_bytes()
              assert archive.read('SHA256SUMS.txt')==(root/'SHA256SUMS.txt').read_bytes()
          assets=['Enhanced_PS5_DualSense_Haptics_V1.43.zip','Enhanced_PS5_DualSense_Haptics_Bridge_V1.43.zip','BRIDGE_COMPATIBILITY.json']
          (root/'Release/RELEASE_SHA256SUMS.txt').write_text(''.join(
              hashlib.sha256((root/'Release'/name).read_bytes()).hexdigest()+'  '+name+'\n'
              for name in assets),encoding='utf-8')
          PY
      - name: Commit updated archive and clean up workflow
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/sync-v143-short-readme.yml
          git add README.md SHA256SUMS.txt Release/Enhanced_PS5_DualSense_Haptics_Bridge_V1.43.zip Release/RELEASE_SHA256SUMS.txt
          git diff --cached --check
          git commit -m "Sync short USB audio troubleshooting note into V1.43 Bridge package"
          git push origin HEAD:main
